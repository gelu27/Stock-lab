name: 更新資料庫

on:
  schedule:
    - cron: "0 10 * * 1-5"   # 週一到週五 台灣時間 18:00
  workflow_dispatch:          # 可以在 Actions 頁面手動按 Run workflow

permissions:
  contents: write

concurrency: data-update

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas requests
      - run: python update_data.py --years 5 --max-minutes 320
      - name: 存回 GitHub
        if: always()
        run: |
          git config user.name "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet || git commit -m "更新資料庫 $(date +%F)"
          git pull --rebase origin main
          git push
      - name: LINE 收盤摘要
        continue-on-error: true
        run: python notify.py daily
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          HOLDINGS: ${{ secrets.HOLDINGS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
