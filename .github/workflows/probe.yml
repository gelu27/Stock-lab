name: 暫時：測試資料來源
on:
  push:
    branches: [claude/project-thread-sbztyk]
    paths: [".github/workflows/probe.yml", "probe.py"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas requests
      - run: python probe.py
