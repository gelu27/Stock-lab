name: 暫時：測試資料來源
on:
  push:
    branches: [claude/project-thread-sbztyk]
    paths: [".github/workflows/probe.yml", "probe.py"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas requests
      - run: python probe.py
      - run: |
          git config user.name "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"
          git add data/fundamental/dividend.csv data/fundamental/dividend_upcoming.csv data/tdcc
          git commit -m "加入除權息與集保資料"
          git push
