name: 暫時測試資料來源
on:
  push:
    branches: [claude/project-thread-4vbzu0]
    paths: ["tmp_probe/**"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests pandas
      - run: python tmp_probe/probe.py
      - run: |
          git config user.name "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"
          git add data/index_ohlc.csv data/us_daily.csv
          git diff --cached --quiet || git commit -m "補指數開高低資料"
          git push
