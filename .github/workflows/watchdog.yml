name: 排程看門狗

on:
  schedule:
    - cron: "5 1 * * 1-6"   # 台灣時間週一到週六 09:05：檢查前一次該跑的排程有沒有成功
  workflow_dispatch:         # cron-job.org 也可以叫這個，GitHub 排程整個停擺時還有人提醒

permissions:
  actions: read     # 只讀 Actions 執行紀錄
  contents: write   # 推播時記 LINE 用量到 ai-reports 分支 line_usage.json

concurrency: watchdog

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install pandas requests pyarrow
      - run: python notify.py watchdog
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
