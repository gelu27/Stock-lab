name: 網紅新片提醒

# 看頻道 RSS 有沒有新影片，有就傳 LINE（連結＋可複製的 Gemini 整理指令）。不用 Gemini、不花額度。
# 頻道清單在 ai-reports 分支的 video_sources.json；每支只提醒一次（記在 intake_seen.json 的「已通知」）。
on:
  # 平日的新片提醒併在「AI 大盤解讀」盤前（08:07）、夜盤（22:13）那則一起傳，這裡只剩週末 21:11 一次（省 LINE 額度）。
  # 想馬上看有沒有新片：在 LINE 打「新片」，用回覆傳，不算額度。
  schedule:
    - cron: "11 13 * * 0,6"   # 台灣時間週六、週日 21:11
  workflow_dispatch:

permissions:
  contents: write

concurrency: intake

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy requests pyarrow
      - run: python -u auto_intake.py remind
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
