name: 暫時-測試ETF資料來源
on:
  push:
    branches: [claude/project-thread-cz1twa]
    paths: [etf_probe.py, etf_data.py, .github/workflows/etf_probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas requests openpyxl beautifulsoup4
      - run: python etf_probe.py
      - name: 抓一次（不存回）
        run: python etf_data.py --days 2 2>&1 | grep -v "已有"
