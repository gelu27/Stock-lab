name: 暫時-測試ETF資料來源
on:
  push:
    branches: [claude/project-thread-cz1twa]
    paths: [etf_data.py, .github/workflows/etf_probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas requests openpyxl beautifulsoup4
      - run: python etf_data.py --days 100 2>&1 | grep -v "已有\|UserWarning\|warn("
      - run: python etf_data.py --health
      - run: |
          git config user.name "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"
          git add -A data/etf
          git diff --cached --quiet || git commit -m "主動式 ETF 持股回補（中信、第一金、群益 00415A 等）"
          git push
