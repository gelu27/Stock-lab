name: 暫時-測試ETF資料來源
on:
  push:
    branches: [claude/project-thread-cz1twa]
    paths: [etf_probe.py, .github/workflows/etf_probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas requests openpyxl
      - run: python etf_probe.py
