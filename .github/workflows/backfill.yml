name: 重建 5 年資料庫

# 一次性：分成 6 段（每段一年）同時下載，最後合併存回 GitHub
on: workflow_dispatch

permissions:
  contents: write

concurrency: data-update

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        year: [2021, 2022, 2023, 2024, 2025, 2026]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: update_data.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas requests
      - run: python update_data.py --years 5 --start ${{ matrix.year }}-01-01 --end ${{ matrix.year }}-12-31 --skip-latest --max-minutes 320
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: data-${{ matrix.year }}
          path: data
          retention-days: 3

  combine:
    needs: download
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas requests
      - name: 移除舊格式
        run: rm -rf data/prices data/otc data/dates.txt data/index.csv
      - uses: actions/download-artifact@v4
        with:
          pattern: data-*
          path: data
          merge-multiple: true
      - name: 補最新一天的資料（分時、興櫃、基本面、匯率）
        run: python update_data.py --years 5 --max-minutes 30
      - name: 存回 GitHub
        run: |
          git config user.name "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"
          git add -A data
          git commit -m "重建 5 年資料庫（上市＋上櫃＋ETF＋籌碼）"
          git pull --rebase origin main
          git push
