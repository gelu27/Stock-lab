name: LINE 推播

on:
  schedule:
    - cron: "*/15 1-5 * * 1-5"   # 週一到週五 台灣時間 09:00~13:45，每 15 分鐘檢查到價提醒
  workflow_dispatch:
    inputs:
      mode:
        description: "test = 傳測試訊息、daily-force = 立刻傳最近一天收盤摘要、alert = 檢查到價"
        default: test
        type: choice
        options: [test, daily-force, alert]

permissions:
  contents: write

concurrency: line-alert

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas requests
      - run: python notify.py ${{ github.event.inputs.mode || 'alert' }}
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          HOLDINGS: ${{ secrets.HOLDINGS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
