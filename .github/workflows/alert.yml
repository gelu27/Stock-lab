name: LINE 推播

on:
  schedule:
    - cron: "*/15 1-5 * * 1-5"   # 週一到週五 台灣時間 09:00~13:45，每 15 分鐘檢查到價提醒
  workflow_dispatch:
    inputs:
      mode:
        description: "test = 傳測試訊息、daily-force = 立刻傳最近一天收盤摘要、alert = 檢查到價、check = 檢查 SITE_PASSWORD"
        default: test
        type: choice
        options: [test, daily-force, alert, check]

permissions:
  contents: write

concurrency: line-alert

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install pandas requests pyarrow
      - run: python notify.py ${{ github.event.inputs.mode || 'alert' }}
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          HOLDINGS: ${{ secrets.HOLDINGS }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
