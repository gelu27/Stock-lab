name: tmp health test
on:
  push:
    branches: [claude/project-thread-vmuckf]
    paths: [".github/workflows/tmp-health.yml"]
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas requests pyarrow
      - run: python notify.py health
      - run: curl -s "https://mis.twse.com.tw/stock/api/getStockInfo.jsp?ex_ch=tse_t00.tw&json=1&delay=0" | head -c 600
      - run: python -c "import engine; engine.更新評分回測(強制=True)"
