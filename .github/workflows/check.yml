name: 網站自動檢查

on:
  push:
    branches: [main]
    paths-ignore: ["data/**"]   # 每天的資料更新不用跑
  pull_request:
  workflow_dispatch:

jobs:
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 自家模組都有重新載入（避免部署後用到舊版）
        run: python tests/test_reload.py
      - name: 每個頁面都打開看看有沒有錯誤
        run: python tests/test_pages.py
      - name: 網站錯誤通知不重複推播
        run: python tests/test_error_notify.py
      - name: 止跌訊號（指數 vs 融資、借券、賣壓消散、破低不破）
        run: python tests/test_bottom_signals.py
      - name: 融資成本估算
        run: python tests/test_margin.py
      - name: 面額分割換算
        run: python tests/test_split.py
      - name: 新聞事件工具（舊聞、事件反應、金額換算、業外）
        run: python tests/test_news_tools.py
      - name: AI 報告 json 拆解與目標價檢查
        run: python tests/test_ai_card.py
      - name: 止跌與抄底工具
        run: python tests/test_dip_tools.py
      - name: 主動式 ETF 績效體檢、除權息日報酬
        run: python tests/test_etf_perf.py
