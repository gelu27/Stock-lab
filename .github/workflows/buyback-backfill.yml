name: 補庫藏股歷史

# 一次性：從 2019 年起每年一段，把公開資訊觀測站的庫藏股決議補進 data/buyback.csv（庫藏股回測要多年樣本）。
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency: data-update

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            update_data.py
            data/status
            data/buyback.csv
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install pandas requests
      - name: 抓 2019 年起的庫藏股決議
        run: python -c "import update_data as u; u.抓庫藏股歷史(2019)"
      - name: 存回 GitHub
        run: |
          git config user.name "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"
          git add data/buyback.csv
          git diff --cached --quiet && exit 0
          git commit -m "補庫藏股歷史決議（回測用）"
          git pull --rebase
          git push
