name: 補庫藏股歷史

# 一次性：從 2019 年起每年一段，把公開資訊觀測站的庫藏股決議補進 data/buyback.csv（庫藏股回測要多年樣本）。
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency: data-update

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: |
            update_data.py
            data/status
            data/buyback.csv
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install pandas requests
      - name: 抓 2019 年起的庫藏股決議
        run: python -c "import update_data as u; u.抓庫藏股歷史(2019)"
      - name: 存回 GitHub
        run: |
          git config user.name "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"
          git add data/buyback.csv
          git diff --cached --quiet && exit 0
          git commit -m "補庫藏股歷史決議（回測用）"
          git pull --rebase
          git push
