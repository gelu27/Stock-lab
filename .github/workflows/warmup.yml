name: 網站預熱

on:
  workflow_run:
    workflows: ["更新資料庫"]
    types: [completed]
  schedule:
    - cron: "20 0 * * 1-5"   # 台灣時間 08:20 開盤前再預熱一次（網站半夜睡著後暫存會清空）
  workflow_dispatch:

permissions:
  contents: read

jobs:
  warmup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - name: 等網站重新部署（資料更新會讓網站重新啟動）
        if: github.event_name == 'workflow_run'
        run: sleep 180
      - name: 打開網站，讓它先讀好資料（預設首頁、完整首頁、手機首頁、個股頁）
        run: python tests/warmup.py "${{ vars.SITE_URL || 'https://taisc-stock.streamlit.app' }}"
