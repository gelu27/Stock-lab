name: 暫時探測合約負債
on:
  push:
    branches: [claude/project-thread-18bnbn]
    paths: [probe/**]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pandas requests
      - run: python probe/cl_probe.py
