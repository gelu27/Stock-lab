name: LINE 週報

on:
  schedule:
    - cron: "0 2 * * 6"   # 每週六 台灣時間 10:00
    - cron: "0 5 * * 6"   # 備援：台灣時間 13:00（當天已成功就跳過）
    - cron: "0 9 * * 6"   # 備援：台灣時間 17:00（當天已成功就跳過）
  workflow_dispatch:
    inputs:
      backup:
        description: "備援模式：過去 20 小時內已成功跑過就跳過（cron-job.org 用 true；手動補跑用 false）"
        type: boolean
        default: false

permissions:
  contents: write   # LINE 用量紀錄 line_usage.json 存在 ai-reports 分支
  actions: read     # 查過去有沒有成功跑過，避免同一天重複推播

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LINE_OUTBOX: /tmp/line_outbox.json   # 週報＋Gemini 用量小卡合成 1 則推播
    steps:
      - name: 備援檢查（過去 20 小時已成功就跳過）
        id: dup
        if: github.event_name == 'schedule' || inputs.backup == true
        run: |
          since=$(date -u -d '20 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/weekly.yml/runs?status=success&created=>=${since}&per_page=5" --jq '.total_count' || echo 0)
          echo "過去 20 小時成功次數：$n"
          if [ "$n" -gt 0 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.dup.outputs.skip != 'true'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: steps.dup.outputs.skip != 'true'
        with:
          python-version: "3.12"
      - run: pip install pandas requests pyarrow
        if: steps.dup.outputs.skip != 'true'
      - run: python notify.py weekly
        if: steps.dup.outputs.skip != 'true'
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          HOLDINGS: ${{ secrets.HOLDINGS }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 每週 Gemini 用量小卡（LINE）
        if: always() && steps.dup.outputs.skip != 'true'
        run: pip install -q pandas numpy requests pyarrow && python auto_intake.py usage
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 每週備份 ai-reports 分支（自選股、提醒、AI 報告；交易日記與筆記保持加密）
        if: always() && steps.dup.outputs.skip != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ai-reports
          path: backup
      - name: 上傳備份（Actions 這次執行頁面的 Artifacts，保留 90 天）
        if: always() && steps.dup.outputs.skip != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ai-reports-backup-${{ github.run_id }}
          path: backup/
          retention-days: 90
      - name: LINE 合併送出
        if: always() && steps.dup.outputs.skip != 'true'
        continue-on-error: true
        run: python notify.py flush
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
