name: LINE 週報

on:
  schedule:
    - cron: "0 2 * * 6"   # 每週六 台灣時間 10:00
  workflow_dispatch:

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas requests pyarrow
      - run: python notify.py weekly
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          HOLDINGS: ${{ secrets.HOLDINGS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 每週備份 ai-reports 分支（自選股、提醒、AI 報告；交易日記與筆記保持加密）
        if: always()
        uses: actions/checkout@v4
        with:
          ref: ai-reports
          path: backup
      - name: 上傳備份（Actions 這次執行頁面的 Artifacts，保留 90 天）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-reports-backup-${{ github.run_id }}
          path: backup/
          retention-days: 90
