name: LINE 週報

on:
  schedule:
    - cron: "0 2 * * 6"   # 每週六 台灣時間 10:00
  workflow_dispatch:

permissions:
  contents: write   # LINE 用量紀錄 line_usage.json 存在 ai-reports 分支

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LINE_OUTBOX: /tmp/line_outbox.json   # 週報＋Gemini 用量小卡合成 1 則推播
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install pandas requests pyarrow
      - run: python notify.py weekly
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          HOLDINGS: ${{ secrets.HOLDINGS }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 每週 Gemini 用量小卡（LINE）
        if: always()
        run: pip install -q pandas numpy requests pyarrow && python auto_intake.py usage
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 每週備份 ai-reports 分支（自選股、提醒、AI 報告；交易日記與筆記保持加密）
        if: always()
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ai-reports
          path: backup
      - name: 上傳備份（Actions 這次執行頁面的 Artifacts，保留 90 天）
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ai-reports-backup-${{ github.run_id }}
          path: backup/
          retention-days: 90
      - name: LINE 合併送出
        if: always()
        continue-on-error: true
        run: python notify.py flush
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
